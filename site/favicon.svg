      <rect x="12.5" y="7" width="1" height="13" fill="#1d1715" fill-opacity=".22"/>
      <rect x="6" y="13.5" width="13" height="1" fill="#1d1715" fill-opacity=".22"/>
    </g>
    <line x1="17.3" y1="18.3" x2="25" y2="26" stroke="#1d1715" stroke-opacity=".35" stroke-width="4.2" stroke-linecap="round"/>
    <line x1="17.3" y1="18.3" x2="24.6" y2="25.6" stroke="#f1dfc2" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="12.5" cy="13.5" r="6.4" fill="none" stroke="#f6e9d4" stroke-width="2"/>
