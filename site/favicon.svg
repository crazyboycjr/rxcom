<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="32" height="32" viewBox="0 0 32 32">
  <title>rxcom</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#382c29"/>
      <stop offset="1" stop-color="#1d1715"/>
    </linearGradient>
    <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
    <clipPath id="glass"><circle cx="12.5" cy="13.5" r="6.4"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ground)"/>
  <g clip-path="url(#tile)">
    <rect x="3" y="4" width="17" height="13" rx="1.5" fill="#3f9c91" fill-opacity=".92"/>
    <rect x="7" y="8" width="17" height="13" rx="1.5" fill="#f0a84a" fill-opacity=".88"/>
    <rect x="12" y="13" width="17" height="13" rx="1.5" fill="#e45e3e" fill-opacity=".88"/>
    <g clip-path="url(#glass)" shape-rendering="crispEdges">
