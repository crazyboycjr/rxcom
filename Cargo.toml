[package]
name = "rxcom"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "An X11 compositor with a full-desktop zoom"
license = "MIT"
repository = "https://github.com/crazyboycjr/rxcom"
homepage = "https://crazyboycjr.github.io/rxcom/"
publish = false

[dependencies]
anyhow = "1"
ash = "0.38"
glow = "0.17"
libc = "0.2"
log = "0.4"
x11-dl = "2.21"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "composite", "damage", "dri3", "randr", "render", "screensaver", "shape", "sync", "xfixes", "xinput"] }

[profile.release]
debug = 1
