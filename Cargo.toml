[package]
name = "rxcom"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An X11 compositor on Vulkan"
license = "MIT"

[dependencies]
anyhow = "1"
ash = "0.38"
libc = "0.2"
log = "0.4"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "composite", "damage", "dri3", "present", "randr", "shape", "shm", "sync", "xfixes"] }

[profile.release]
debug = 1
